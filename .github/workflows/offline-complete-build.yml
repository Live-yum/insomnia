name: Offline complete portable validation

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to validate
        type: string
        required: true
      publish:
        description: Publish tested full-plugin candidate (only develop may publish)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  NODE_OPTIONS: --max_old_space_size=6144
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  SCARF_DO_NOT_TRACK: 'true'
  SCARF_ANALYTICS: 'false'
  DO_NOT_TRACK: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify committed source, archive protections and reviewed crypto
        run: |
          test -f docs/OFFLINE-CONSOLIDATION.json
          python3 -m unittest discover -s scripts/offline -p 'test_*.py' -v
          python3 scripts/offline/vendor_plugins.py verify
          node --experimental-strip-types --test scripts/offline/crypto.test.cjs scripts/offline/policy.test.mjs
      - name: Install locked application build dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/offline-install.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-install.log"; exit 1; }
      - name: Workspace lint without autofix
        run: npm run lint --workspaces --if-present > "$RUNNER_TEMP/offline-lint.log" 2>&1 || { cat "$RUNNER_TEMP/offline-lint.log"; exit 1; }
      - name: Workspace and route type checks
        run: npm run type-check --workspaces --if-present > "$RUNNER_TEMP/offline-types.log" 2>&1 || { cat "$RUNNER_TEMP/offline-types.log"; exit 1; }
      - name: Build real application before tests
        run: npm run app-build > "$RUNNER_TEMP/offline-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-build.log"; exit 1; }
      - name: Prepare Node ABI for the complete unit suite
        run: npm run install-libcurl-node > "$RUNNER_TEMP/offline-node-abi.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-node-abi.log"; exit 1; }
      - name: Complete workspace unit suites
        run: npm run test --workspaces --if-present > "$RUNNER_TEMP/offline-unit.log" 2>&1 || { tail -n 400 "$RUNNER_TEMP/offline-unit.log"; exit 1; }
      - name: Record tested source
        run: |
          git diff --exit-code
          printf '{"status":"passed","sourceCommit":"%s"}\n' "$(git rev-parse HEAD)" > offline-quality.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-complete-quality
          path: offline-quality.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-complete-quality-diagnostics
          path: ${{ runner.temp }}/offline-*.log
          if-no-files-found: warn
          retention-days: 14

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
            resource_target: win32-x64
            platform: win
            arch: x64
            directory: win-unpacked
            executable: Insomnia.exe
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            resource_target: linux-arm64
            platform: linux
            arch: arm64
            directory: linux-arm64-unpacked
            executable: insomnia
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      INSOMNIA_OFFLINE_SMOKE_EXE: packages/insomnia/dist/${{ matrix.directory }}/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare all pinned local plugin dependency trees without npm or lifecycle scripts
        run: |
          test -f docs/OFFLINE-CONSOLIDATION.json
          python -m unittest discover -s scripts/offline -p 'test_*.py' -v
          python scripts/offline/vendor_plugins.py materialize --target '${{ matrix.resource_target }}' --output packages/insomnia/offline-plugin-resources
      - name: Install Linux GUI and native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libsecret-1-0 libcurl4-openssl-dev xvfb xauth
      - name: Install locked application dependencies in the connected build zone
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/offline-install.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-install.log"; exit 1; }
      - name: Validate reviewed crypto and complete application types
        run: |
          node --experimental-strip-types --test scripts/offline/crypto.test.cjs scripts/offline/policy.test.mjs
          npm run type-check -w insomnia > "$RUNNER_TEMP/offline-types.log" 2>&1 || { cat "$RUNNER_TEMP/offline-types.log"; exit 1; }
      - name: Compile actual committed source
        run: npm run app-build > "$RUNNER_TEMP/offline-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-build.log"; exit 1; }
      - name: Package native application without automatic publishing
        working-directory: packages/insomnia
        run: npx --no-install electron-builder --config electron-builder.offline.cjs --dir --${{ matrix.platform }} --${{ matrix.arch }} --publish never > "$RUNNER_TEMP/offline-package.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/offline-package.log"; exit 1; }
      - name: Require every full-catalog resource byte in the native output
        run: python scripts/offline/stage_resources.py --directory packages/insomnia/dist/${{ matrix.directory }} --target '${{ matrix.resource_target }}'
      - name: Windows clean-profile UI, full catalog, crypto and business API smoke
        if: runner.os == 'Windows'
        run: node scripts/offline/smoke.mjs > "$RUNNER_TEMP/offline-smoke.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/offline-smoke.log"; exit 1; }
      - name: Preserve the upstream Windows secure wrapper
        if: runner.os == 'Windows'
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          bash ./build-secure-wrapper.sh CI
      - name: Validate released Windows wrapper with no debugger or sandbox-disabling flags
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/offline/smoke-windows-wrapper.ps1
      - name: Linux full desktop smoke with only loopback network interfaces
        if: runner.os == 'Linux'
        run: bash scripts/offline/smoke-linux.sh > "$RUNNER_TEMP/offline-smoke.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/offline-smoke.log"; exit 1; }
      - name: Archive only validated native output, reports and portable launchers
        run: python scripts/offline/package-complete.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: insomnia-complete-${{ matrix.target }}
          path: offline-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-complete-diagnostics-${{ matrix.target }}
          path: |
            offline-resource-integrity.json
            offline-test-results/
            packages/insomnia/offline-plugin-resources/catalog.json
            ${{ runner.temp }}/offline-*.log
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [quality, build]
    if: inputs.publish && github.repository == 'Live-yum/insomnia' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: insomnia-complete-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-complete-quality
          path: quality-evidence
      - name: Recheck exact-source runtime proofs and checksums before release
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release-assets')
          sha = os.environ['SOURCE_SHA']
          quality = json.loads(pathlib.Path('quality-evidence/offline-quality.json').read_text(encoding='utf-8'))
          assert quality['status'] == 'passed' and quality['sourceCommit'] == sha
          for target in ['windows-x64', 'linux-arm64']:
              report = json.loads((root / (target + '-validation.json')).read_text(encoding='utf-8'))
              assert report['sourceCommit'] == sha and report['platform'] == target
              assert report['desktopSmoke']['status'] == 'passed'
              assert report['desktopSmoke']['sourceCommit'] == sha
              name = report['archive']
              assert pathlib.PurePosixPath(name).name == name
              with (root / name).open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == report['archiveSha256']
              assert report['archiveBytes'] == (root / name).stat().st_size
              if target == 'windows-x64':
                  assert report['windowsWrapper']['status'] == 'passed'
          assert len(list(root.glob('*.zip'))) == len(list(root.glob('*.tar.gz'))) == 1
          PY
          cd release-assets
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - name: Publish actual full-plugin portable candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="offline-full-13.3.0-${RUN_ID}"
          gh release create "$tag" release-assets/* --target "$SOURCE_SHA" --prerelease --title 'Insomnia Offline 13.3.0 — full plugin catalog portable' --notes 'Windows x64 and Linux ARM64 portable packages with the complete public plugin snapshot accounted for, 545 materialized isolated dependency trees and explicit exceptions. Reviewed Crypto and Offline Crypto Tools are active; other community plugins start disabled. Native architecture, resource hashes, clean-profile no-login project creation/persistence, authenticated HMAC, real loopback API transport and browser-denial control passed. Windows secure wrapper separately tested without debugger flags; Linux desktop tested with loopback-only network namespace. Full workspace quality gate passed. This is not proof that every third-party plugin works without external services or a site security certification. See bundled OFFLINE-README.md and validation reports.'
          gh release view "$tag" --json url,assets,targetCommitish,isPrerelease
