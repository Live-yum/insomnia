name: Offline portable build
on:
  push:
    branches: [offline/complete-portable, develop]
    paths-ignore:
      - scripts/offline/repair_complete_quality.py
      - .github/workflows/offline-complete-quality-repair.yml
      - scripts/offline/consolidate_source.py
      - .github/workflows/offline-consolidate.yml
      - .github/workflows/offline-log-diagnostics.yml
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-complete-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  complete:
    if: github.repository == 'Live-yum/insomnia' && github.event_name != 'pull_request'
    uses: ./.github/workflows/offline-complete-build.yml
    with:
      source_sha: ${{ github.sha }}
      publish: false
    permissions:
      contents: read
  external-pr:
    if: github.repository == 'Live-yum/insomnia' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/offline-complete-build.yml
    with:
      source_sha: ${{ github.sha }}
      publish: false
    permissions:
      contents: read
