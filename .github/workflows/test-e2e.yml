name: e2e App Tests

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  SCARF_DO_NOT_TRACK: 'true'
  SCARF_ANALYTICS: 'false'
  DO_NOT_TRACK: '1'
  PYTHONUTF8: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build actual app for all UI projects
        env:
          NODE_OPTIONS: --max_old_space_size=6144
        run: npm run app-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-build
          path: packages/insomnia/build/
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6]
        shardTotal: [6]
    env:
      SHARD_INDEX: ${{ matrix.shardIndex }}
      SHARD_TOTAL: ${{ matrix.shardTotal }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native GUI and disposable real keyring prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-keyring libsecret-tools libsecret-1-0 dbus-x11 xvfb xauth
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Electron serially
        uses: ./.github/actions/prepare-electron
      - name: Configure trusted sandbox helper without disabling sandboxing
        working-directory: packages/insomnia
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: app-build
          path: packages/insomnia/build/
      - name: Fresh Chinese UI and two-way restart persistence
        if: matrix.shardIndex == 1
        run: dbus-run-session -- bash scripts/offline/run-with-ci-keyring.sh xvfb-run -a node scripts/offline/test-chinese-interface.mjs
      - name: Complete assigned UI shard without test filters or retries
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash scripts/offline/run-with-ci-keyring.sh npm run test:build -w packages/insomnia-smoke-test -- --shard="$SHARD_INDEX/$SHARD_TOTAL" --retries=0
      - name: Preserve every trace under cross-platform safe archive names
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        run: python3 scripts/offline/collect_playwright_traces.py --source packages/insomnia-smoke-test/traces --output "$RUNNER_TEMP/playwright-traces.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        with:
          name: ubuntu-smoke-test-traces-${{ github.run_number }}-shard-${{ matrix.shardIndex }}
          path: ${{ runner.temp }}/playwright-traces.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        with:
          name: junit-results-${{ github.run_number }}-shard-${{ matrix.shardIndex }}
          path: packages/insomnia-smoke-test/test-results.xml
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && matrix.shardIndex == 1 }}
        with:
          name: chinese-interface-evidence
          path: offline-test-results/
          if-no-files-found: error
          retention-days: 14

  junit-summary:
    name: Full UI test results
    needs: [build, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This read-only reporting job executes no application, plugin or artifact code.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: scripts/offline/summarize_ui_results.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: junit-results-${{ github.run_number }}-shard-*
          path: junit-input
          merge-multiple: false
      - name: Require actual success and all six complete JUnit reports
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: python3 scripts/offline/summarize_ui_results.py
