name: e2e App Tests

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  SCARF_DO_NOT_TRACK: 'true'
  SCARF_ANALYTICS: 'false'
  DO_NOT_TRACK: '1'
  PYTHONUTF8: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'
      - name: Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app for smoke tests
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run app-build
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: app-build
          path: packages/insomnia/build/
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6]
        shardTotal: [6]
    env:
      SHARD_INDEX: ${{ matrix.shardIndex }}
      SHARD_TOTAL: ${{ matrix.shardTotal }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'
      - name: Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the lockfile-selected Electron binary before sandbox configuration
        working-directory: packages/insomnia
        shell: bash
        run: |
          set -euo pipefail
          # Electron 43 installs its runtime on demand, not during npm ci.
          # Resolve only the already-installed package; never install a new npm package.
          npx --no-install install-electron
          node -e 'const fs = require("node:fs"); const exe = require("electron"); if (!fs.statSync(exe).isFile()) throw new Error("Electron runtime is missing"); console.log("Installed Electron:", exe);'
      - name: Configure the trusted Electron sandbox helper without disabling sandboxing
        working-directory: packages/insomnia
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: app-build
          path: packages/insomnia/build/
      - name: Smoke test electron app (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          # Every workflow attempt validates the complete shard, not stale last-failed state.
          npm run test:build -w packages/insomnia-smoke-test -- --project=Smoke --shard="$SHARD_INDEX/$SHARD_TOTAL"
      - name: Preserve all Playwright diagnostics under cross-platform archive names
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        shell: bash
        run: python3 scripts/offline/collect_playwright_traces.py --source packages/insomnia-smoke-test/traces --output "$RUNNER_TEMP/playwright-traces.zip"
      - name: Upload smoke test diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        with:
          if-no-files-found: error
          name: ubuntu-smoke-test-traces-${{ github.run_number }}-shard-${{ matrix.shardIndex }}
          path: ${{ runner.temp }}/playwright-traces.zip
          compression-level: 0
          retention-days: 14
      - name: Upload junit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        with:
          if-no-files-found: error
          name: junit-results-${{ github.run_number }}-shard-${{ matrix.shardIndex }}
          path: packages/insomnia-smoke-test/test-results.xml

  junit-summary:
    name: Full UI JUnit summary
    needs: [build, test]
    if: ${{ always() && !cancelled() && github.repository == 'Live-yum/insomnia' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      # This reporting-only job checks out no repository and executes no app,
      # plugin, test, or artifact code. XML is bounded, validated data only.
      - name: Download this run's JUnit artifacts, keeping each shard separate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          pattern: junit-results-${{ github.run_number }}-shard-*
          path: junit-input
          merge-multiple: false
      - name: Publish real case counts and bounded assertion failures as a check result
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          python3 - <<'PY'
          import html, json, os, pathlib, re, subprocess, xml.etree.ElementTree as ET
          repo = 'Live-yum/insomnia'
          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise SystemExit('Unexpected report repository')
          sha = os.environ['REPORT_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('An exact source commit is required')
          run = os.environ['GITHUB_RUN_ID']
          number = os.environ['GITHUB_RUN_NUMBER']
          if not run.isdecimal() or not number.isdecimal():
              raise SystemExit('Invalid run identifiers')
          root = pathlib.Path('junit-input')
          failures, diagnostics, shards = [], [], []
          total = skipped = 0
          for index in range(1, 7):
              file = root / f'junit-results-{number}-shard-{index}' / 'test-results.xml'
              if not file.is_file() or file.is_symlink():
                  diagnostics.append(f'Shard {index}: missing regular JUnit report')
                  continue
              if file.stat().st_size > 20 * 1024 * 1024:
                  diagnostics.append(f'Shard {index}: report exceeds safe XML size')
                  continue
              raw = file.read_bytes()
              # Reject UTF-16/32 and XML entity/DTD declarations before parsing.
              # The Playwright JUnit reporter writes UTF-8 and needs no entities.
              if b'\0' in raw or b'<!DOCTYPE' in raw.upper() or b'<!ENTITY' in raw.upper():
                  diagnostics.append(f'Shard {index}: disallowed XML encoding or declaration')
                  continue
              try:
                  tree = ET.fromstring(raw.decode('utf-8-sig'))
              except (ValueError, UnicodeError, ET.ParseError) as error:
                  diagnostics.append(f'Shard {index}: invalid XML ({type(error).__name__})')
                  continue
              cases = list(tree.iter('testcase'))
              if not cases or len(cases) > 10000:
                  diagnostics.append(f'Shard {index}: missing or excessive testcase records')
                  continue
              shards.append(index)
              total += len(cases)
              for case in cases:
                  skipped += int(case.find('skipped') is not None)
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = failure.text or failure.get('message', '')
                      message = re.sub(r'\x1b\[[0-9;]*m', '', message)
                      message = ''.join(character for character in message if character in '\n\t' or ord(character) >= 32)
                      failures.append({'shard': index, 'name': case.get('name', '')[:500], 'file': case.get('classname', '')[:300], 'message': message[:4000]})
          passed = (os.environ['BUILD_RESULT'] == 'success' and os.environ['TEST_RESULT'] == 'success'
                    and shards == list(range(1, 7)) and total > skipped and not failures and not diagnostics)
          conclusion = 'success' if passed else 'failure'
          title = f'{total} cases, {len(failures)} failures, {skipped} skipped; {len(shards)}/6 reports'
          summary = f'## Full six-shard UI results\n\n{title}\n\nSource: `{sha}`. Run: {run}.\n\n'
          summary += 'Missing, cancelled or failed shards are never represented as successful validation. Existing per-case skips are counted explicitly.\n\n'
          for diagnostic in diagnostics:
              summary += html.escape(diagnostic) + '\n\n'
          for failure in failures:
              text = f'### Shard {failure["shard"]}: {html.escape(failure["file"])} — {html.escape(failure["name"])}\n\n<pre>{html.escape(failure["message"])}</pre>\n\n'
              if len((summary + text).encode('utf-8')) > 56000:
                  summary += '\nFurther failures are preserved in the original per-shard JUnit and trace artifacts.\n'
                  break
              summary += text
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(summary)
          payload = {'name': 'Full UI test results', 'head_sha': sha, 'status': 'completed', 'conclusion': conclusion,
                     'details_url': f'https://github.com/{repo}/actions/runs/{run}',
                     'output': {'title': title, 'summary': summary}}
          subprocess.run(['gh', 'api', f'repos/{repo}/check-runs', '--method', 'POST', '--input', '-', '--silent'],
                         input=json.dumps(payload), text=True, check=True)
          print(title)
          raise SystemExit(0 if passed else 1)
          PY
