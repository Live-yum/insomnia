name: Release Recurring

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recurring-offline-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This fork delivers Windows x64 and Linux ARM64. Use the exact same full
  # catalog, offline configuration and tests as the packages users receive.
  # Critical request/script/code-generation/TLS/restart tests are mandatory
  # inside this reusable build before the Windows anti-debugging wrapper.
  complete:
    if: github.repository == 'Live-yum/insomnia'
    uses: ./.github/workflows/offline-complete-build.yml
    with:
      source_sha: ${{ github.sha }}
      publish: false
    permissions:
      contents: read
  recurring-required:
    name: Recurring release validation required
    needs: complete
    if: ${{ always() && github.repository == 'Live-yum/insomnia' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require quality and both real native package test jobs
        env:
          RESULT: ${{ needs.complete.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULT" != success ]; then
            echo "Recurring offline release validation did not pass: $RESULT"
            exit 1
          fi
