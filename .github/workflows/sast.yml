name: SAST

on:
  pull_request: {}
  push:
    branches:
      - develop
      - release/*
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sast-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    timeout-minutes: 20
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: '3.12'
      - name: Install the pinned scanner in its own environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check 'semgrep==1.178.0'
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip check
          mkdir -p "$RUNNER_TEMP/semgrep-reports"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/semgrep-reports/scanner-dependencies.txt"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version
      - name: Scan the PR diff or complete branch with the existing automatic rule selection
        id: scan
        shell: bash
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          set -uo pipefail
          # Temporarily collect the real scan status so reports can be uploaded.
          # The final required step enforces it even if another step fails.
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" ci --config auto --no-autofix --no-suppress-errors --metrics off --disable-version-check \
            --text --text-output "$RUNNER_TEMP/semgrep-reports/scan.txt" \
            --json-output "$RUNNER_TEMP/semgrep-reports/scan.json" \
            --sarif-output "$RUNNER_TEMP/semgrep-reports/scan.sarif"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > "$RUNNER_TEMP/semgrep-reports/exit-code.txt"
          if [ -s "$RUNNER_TEMP/semgrep-reports/scan.sarif" ]; then
            echo 'sarif_exists=true' >> "$GITHUB_OUTPUT"
          fi
          # A crash or missing report remains a failing gate; never manufacture SARIF.
      - name: Show actual findings and scanner diagnostics
        if: ${{ !cancelled() && steps.scan.outputs.exit_code != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'semgrep-reports'
          report = root / 'scan.json'
          if not report.is_file():
              raise SystemExit('The scanner did not produce a JSON report')
          data = json.loads(report.read_text(encoding='utf-8'))
          findings = data.get('results', [])
          errors = data.get('errors', [])
          print('Actual findings:', len(findings), 'Scanner diagnostics:', len(errors), flush=True)
          for result in findings:
              print(json.dumps({'rule': result.get('check_id'), 'path': result.get('path'), 'start': result.get('start'), 'end': result.get('end'), 'message': result.get('extra', {}).get('message')}, ensure_ascii=False), flush=True)
          for error in errors:
              print(json.dumps(error, ensure_ascii=False), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## Semgrep 1.178.0\n\nActual findings: {len(findings)}. Scanner diagnostics: {len(errors)}.\n\nThe original automatic rule selection is retained. JSON, text, SARIF and the real exit code are attached. Scanner errors and findings are not converted to successful empty reports.\n')
          PY
      - name: Upload the actual scanner reports
        if: ${{ !cancelled() && steps.scan.outputs.exit_code != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: semgrep-sast-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semgrep-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif_exists == 'true' }}
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0, Node 24
        with:
          sarif_file: ${{ runner.temp }}/semgrep-reports/scan.sarif
          category: sast_semgrep
      - name: Require successful scanning with real reports and no source autofix
        if: ${{ always() && !cancelled() }}
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCAN_EXIT_CODE" = 0
          test -s "$RUNNER_TEMP/semgrep-reports/scan.json"
          test -s "$RUNNER_TEMP/semgrep-reports/scan.sarif"
          git diff --exit-code
