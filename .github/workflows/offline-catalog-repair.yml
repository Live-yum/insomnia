name: Repair pinned offline catalog
on:
  push:
    branches: [offline/catalog-repair]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: offline/catalog-repair
      - name: Restore original binary bytes using original pinned SHA256 and registry integrity
        run: python3 scripts/offline/restore-pinned-archives.py
      - name: Repair the existing pinned snapshot and verify every archived dependency
        run: python3 scripts/offline/vendor_plugins.py repair --workers 12
      - name: Commit verified archives without force push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes vendor/offline-plugins
          if ! git diff --cached --quiet; then git commit -m 'fix: restore binary npm archives and verify complete pinned catalog'; fi
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/offline/catalog-repair
      - name: Capture small report
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path('vendor/offline-plugins/manifest.json').read_text())
          report = {k:v for k,v in manifest.items() if k != 'entries'}
          report['catalogEntries'] = len(manifest['entries'])
          report['archives'] = len(list(Path('vendor/offline-plugins/blobs').glob('*.tgz')))
          report['archiveBytes'] = sum(p.stat().st_size for p in Path('vendor/offline-plugins/blobs').glob('*.tgz'))
          Path('offline-catalog-summary.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-offline-catalog-report
          path: |
            offline-catalog-summary.json
            vendor/offline-plugins/REPORT.md
            vendor/offline-plugins/EXCEPTIONS.json
          retention-days: 7
