name: Test App

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  SCARF_DO_NOT_TRACK: 'true'
  SCARF_ANALYTICS: 'false'
  DO_NOT_TRACK: '1'
  PYTHONUTF8: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

jobs:
  Test:
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned Electron before parallel unit imports
        uses: ./.github/actions/prepare-electron
      - name: Require zero-warning workspace lint
        run: npm run lint --workspaces --if-present -- --max-warnings=0
      - name: Type checks
        run: npm run type-check
      - name: Build actual application before generated-entrypoint tests
        env:
          NODE_OPTIONS: --max_old_space_size=6144
        run: npm run app-build
      - name: Prepare Node ABI and run all workspace unit tests
        run: |
          npm run install-libcurl-node
          npm test
      - name: Complete Inso CLI unit tests
        run: npm run test:unit -w insomnia-inso
      - name: Check autocomplete snippets are up to date
        run: |
          npm run generate:autocomplete -w insomnia-scripting-environment
          if ! git diff --exit-code packages/insomnia-scripting-environment/src/autocomplete-snippets.json; then
            echo "::error::autocomplete-snippets.json is out of date. Regenerate and commit it."
            exit 1
          fi
      - name: Check Insomnia JSON schema is up to date
        run: |
          npm run generate:schema -w insomnia
          git add -N schemas/
          if ! git diff --exit-code schemas/; then
            echo "::error::schemas/ is out of date. Regenerate and commit it."
            exit 1
          fi
      - name: Install sandbox-vendored packages and enforce version bounds
        run: npm run sandbox:vendored:ci -w insomnia
      - name: Check sandbox-vendored bundles are up to date
        run: |
          npm run sandbox:vendored:generate -w insomnia
          if ! git diff --exit-code packages/insomnia/src/templating/sandbox/vendored/*.generated.ts; then
            echo "::error::Sandbox-vendored bundles are out of date or hand-edited. Regenerate and commit them."
            exit 1
          fi
      - name: Require all sandbox-vendored regression tests
        run: npm run sandbox:vendored:test-regression -w insomnia
      - name: Require the unchanged circular-reference ratchet
        shell: bash
        run: |
          set -euo pipefail
          npm run check-cycle-references | tee cycle-report.txt
          {
            echo '## Circular-reference validation'
            echo '```text'
            cat cycle-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify source-localization boundaries and native crypto interoperation
        run: |
          node --test scripts/offline/localize-ui.test.cjs scripts/offline/portable-crypto.test.cjs scripts/offline/crypto-openssl-interop.test.cjs
          python3 -m unittest discover -s scripts/offline -p 'test_*.py'
