name: Offline failure diagnostics
on:
  push:
    branches: [offline/standalone-vendored]
    paths: [.github/workflows/offline-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'Live-yum/insomnia'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read prior inert unit-test diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36096337631 --repo Live-yum/insomnia --name offline-ci-diagnostics --dir "$RUNNER_TEMP/offline-diagnostics"
      - name: Print failure blocks and suite totals without executing application code
        shell: python
        run: |
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'offline-diagnostics'
          path = root / 'offline-unit.log'
          text = re.sub(r'\x1b\[[0-9;]*m', '', path.read_text(encoding='utf-8'))
          lines = text.splitlines()
          shown = set()
          for i, line in enumerate(lines):
              if re.search(r'^\s*FAIL\s|^\s*Test Files\s|^\s*Tests\s|Unhandled Errors|^Error:', line):
                  for j in range(max(0, i-1), min(len(lines), i+28)):
                      if j not in shown:
                          print(lines[j], flush=True)
                          shown.add(j)
