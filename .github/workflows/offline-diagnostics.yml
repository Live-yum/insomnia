name: Offline failure diagnostics
on:
  push:
    branches: [offline/standalone-vendored]
    paths: [.github/workflows/offline-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'Live-yum/insomnia'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCARF_DO_NOT_TRACK: 'true'
      SCARF_ANALYTICS: 'false'
      DO_NOT_TRACK: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare only locked application tooling, never execute catalog plugins
        run: |
          npm ci --no-audit --no-fund
          npm run install-libcurl-node
      - name: Export only public dependency files and the matching Node executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-toolchain"
          cp "$(command -v node)" "$RUNNER_TEMP/review-toolchain/node"
          { printf 'node_modules\0'; find packages -type d -name node_modules -prune -print0; } > "$RUNNER_TEMP/dependency-paths"
          tar --null -T "$RUNNER_TEMP/dependency-paths" -czf "$RUNNER_TEMP/review-toolchain/dependencies.tar.gz"
          cp package-lock.json "$RUNNER_TEMP/review-toolchain/application-package-lock.json"
          git rev-parse HEAD > "$RUNNER_TEMP/review-toolchain/source.txt"
          cd "$RUNNER_TEMP/review-toolchain"
          sha256sum node dependencies.tar.gz application-package-lock.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: offline-locked-review-toolchain
          path: ${{ runner.temp }}/review-toolchain
          if-no-files-found: error
          retention-days: 3
