name: Offline quality diagnostics
on:
  push:
    branches: [offline/complete-portable]
    paths: [.github/workflows/offline-log-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          artifact-ids: '10847689655'
          run-id: '36097411037'
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Print the actual failing source diagnostics, not just the final workspace warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in Path('diagnostics').rglob('offline-lint.log'):
              print(file.read_text(encoding='utf-8'))
          PY
