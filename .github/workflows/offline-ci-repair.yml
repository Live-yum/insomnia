name: Offline CI source repair

on:
  push:
    branches: [offline/standalone-vendored]
    paths:
      - scripts/offline/repair_ci_source.py
      - .github/workflows/offline-ci-repair.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-source-repair
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  SCARF_DO_NOT_TRACK: 'true'
  SCARF_ANALYTICS: 'false'
  DO_NOT_TRACK: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  prepare:
    if: github.repository == 'Live-yum/insomnia' && github.ref == 'refs/heads/offline/standalone-vendored'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/offline-install.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-install.log"; exit 1; }
      - name: Apply the reviewed source repair before committing it
        run: python3 scripts/offline/repair_ci_source.py
      - name: Require workspace lint without autofix
        run: npm run lint --workspaces --if-present > "$RUNNER_TEMP/offline-lint.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/offline-lint.log"; exit 1; }
      - name: Require complete application and route type checks
        run: npm run type-check -w insomnia > "$RUNNER_TEMP/offline-typecheck.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/offline-typecheck.log"; exit 1; }
      - name: Compile the real application source
        run: npm run app-build > "$RUNNER_TEMP/offline-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-build.log"; exit 1; }
      - name: Use Node ABI for the full unit suite
        run: npm run install-libcurl-node > "$RUNNER_TEMP/offline-node-abi.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/offline-node-abi.log"; exit 1; }
      - name: Require the full workspace unit suite
        run: npm run test --workspaces --if-present > "$RUNNER_TEMP/offline-unit.log" 2>&1 || { tail -n 180 "$RUNNER_TEMP/offline-unit.log"; exit 1; }
      - name: Require archive safety regressions and byte integrity
        run: |
          python3 -m unittest discover -s scripts/offline -p 'test_*.py' -v
          python3 scripts/offline/vendor_plugins.py verify
      - name: Export the tested source changes
        run: |
          git diff --check
          git diff --binary > offline-ci-repair.patch
          git diff --stat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-ci-reviewed-repair
          path: offline-ci-repair.patch
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-ci-diagnostics
          path: ${{ runner.temp }}/offline-*.log
          if-no-files-found: warn
          retention-days: 14

  commit:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-ci-reviewed-repair
          path: ${{ runner.temp }}/offline-repair
      - name: Commit only the exact tested source without executing dependencies
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin offline/standalone-vendored
          test "$(git rev-parse origin/offline/standalone-vendored)" = "$GITHUB_SHA"
          patch="$RUNNER_TEMP/offline-repair/offline-ci-repair.patch"
          if [ -s "$patch" ]; then
            git apply --check "$patch"
            git apply --index "$patch"
            python3 - <<'PY'
          import subprocess
          permitted = {
              'scripts/offline/vendor_plugins.py',
              'packages/insomnia/src/common/__tests__/insomnia-fetch.test.ts',
              'packages/insomnia/src/main/__tests__/bundle-spectral-ruleset.test.ts',
              'packages/insomnia/src/main/__tests__/bundle-spectral-offline.test.ts',
              'packages/insomnia/src/plugins/__tests__/index.test.ts',
              'packages/insomnia/src/plugins/__tests__/plugin-load-order-quickjs-module-resolution.test.ts',
              'packages/insomnia/src/ui/utils/router.test.ts',
          }
          names = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not names <= permitted:
              raise SystemExit('Unexpected repair paths: ' + repr(names - permitted))
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: commit full-suite-validated offline fixtures and idempotent archive extraction'
            git push origin HEAD:offline/standalone-vendored
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  portable:
    needs: commit
    uses: ./.github/workflows/offline-build.yml
    with:
      source_sha: ${{ needs.commit.outputs.sha }}
    permissions:
      contents: read
