name: Offline plugin snapshot

on:
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: Explicitly refresh the public catalog and pinned dependencies; review the resulting diff
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: offline-plugin-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'Live-yum/insomnia' && github.ref == 'refs/heads/offline/standalone-vendored' && inputs.refresh_catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCARF_DO_NOT_TRACK: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_ignore_scripts: 'true'
      npm_config_update_notifier: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test catalog and archive protections without executing plugins
        run: python3 -m unittest discover -s scripts/offline -p 'test_*.py' -v
      - name: Replace prior snapshot cache before downloading verified bytes
        run: |
          rm -rf vendor/offline-plugins/blobs vendor/offline-plugins/profiles
          test -f vendor/offline-plugins/.gitattributes
      - name: Download the exact full catalog and dependencies without lifecycle or Git execution
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: protocol.allow
          GIT_CONFIG_VALUE_0: never
        run: python3 scripts/offline/vendor_plugins.py snapshot --workers 8
      - name: Verify downloaded archive integrity
        run: python3 scripts/offline/vendor_plugins.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-plugin-snapshot
          path: vendor/offline-plugins/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  commit-snapshot:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Replace rather than overlay the previous catalog
        run: |
          rm -rf vendor/offline-plugins/blobs vendor/offline-plugins/profiles
          rm -f vendor/offline-plugins/manifest.json vendor/offline-plugins/catalog-names.json vendor/offline-plugins/REPORT.md vendor/offline-plugins/EXCEPTIONS.json vendor/offline-plugins/plugin-hub.snapshot.html
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-plugin-snapshot
          path: vendor/offline-plugins/
      - name: Commit only the verified package snapshot without rewriting application code
        id: commit
        env:
          REVIEWED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/offline-plugins/manifest.json
          test -f vendor/offline-plugins/.gitattributes
          git fetch origin offline/standalone-vendored
          test "$(git rev-parse origin/offline/standalone-vendored)" = "$REVIEWED_SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force --all -- vendor/offline-plugins
          if ! git diff --cached --quiet; then
            git commit -m 'chore: explicitly refresh the pinned public plugin catalog'
            git push origin HEAD:offline/standalone-vendored
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar --output=offline-source-review.tar HEAD scripts/offline docs packages package.json package-lock.json .nvmrc .npmrc .github
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-source-review
          path: offline-source-review.tar
          if-no-files-found: error
          retention-days: 7

  portable:
    needs: commit-snapshot
    uses: ./.github/workflows/offline-build.yml
    with:
      source_sha: ${{ needs.commit-snapshot.outputs.commit }}
    permissions:
      contents: read
