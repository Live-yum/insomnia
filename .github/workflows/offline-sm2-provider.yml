name: Validate pinned SM2 provider
on:
  push:
    branches: [offline/basic-sm2-provider]
    paths:
      - .github/workflows/offline-sm2-provider.yml
      - scripts/offline/sm2-provider/**
      - scripts/offline/sm2-interop.test.cjs
      - packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/sm2.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-sm2-provider
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
      - name: Resolve exact build-only dependency versions without lifecycle scripts
        working-directory: scripts/offline/sm2-provider
        run: |
          test -f package-lock.json || npm install --package-lock-only --ignore-scripts --no-audit --no-fund --workspaces=false
          npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
          npm audit --omit=dev --audit-level=high --workspaces=false
      - name: Produce bounded standalone module, provenance and required license notices
        run: |
          node scripts/offline/sm2-provider/build.mjs
          node --check packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/sm2.cjs
          node --check packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/sm2-provider.generated.cjs
      - name: Independent OpenSSL encryption and signatures in both directions
        run: node --test scripts/offline/sm2-interop.test.cjs
      - name: Require repeatable generated bytes
        run: |
          sha256sum packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/sm2-provider.generated.cjs > "$RUNNER_TEMP/provider.sha256"
          node scripts/offline/sm2-provider/build.mjs
          sha256sum -c "$RUNNER_TEMP/provider.sha256"
      - name: Export exact verified files, never node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          cp scripts/offline/sm2-provider/package-lock.json "$RUNNER_TEMP/verified/package-lock.json"
          cp packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/sm2-provider.generated.cjs "$RUNNER_TEMP/verified/"
          cp packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/SM2-NOTICE.txt "$RUNNER_TEMP/verified/"
          cp packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/SM2-PROVENANCE.json "$RUNNER_TEMP/verified/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-sm2-provider
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          retention-days: 7
  commit:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-sm2-provider
          path: ${{ runner.temp }}/verified
      - name: Commit validated module and notices as data, without executing them
        run: |
          set -euo pipefail
          git fetch origin offline/basic-sm2-provider
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          verified = pathlib.Path(os.environ['RUNNER_TEMP'])/'verified'
          mapping = {'package-lock.json': 'scripts/offline/sm2-provider/package-lock.json'}
          for name in ('sm2-provider.generated.cjs', 'SM2-NOTICE.txt', 'SM2-PROVENANCE.json'):
              mapping[name] = 'packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/' + name
          assert {p.name for p in verified.iterdir()} == set(mapping)
          for name in mapping:
              p = verified/name
              assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size < 1000000
          provenance = json.loads((verified/'SM2-PROVENANCE.json').read_text(encoding='utf-8'))
          assert hashlib.sha256((verified/'sm2-provider.generated.cjs').read_bytes()).hexdigest() == provenance['sha256']
          for name, destination in mapping.items():
              shutil.copyfile(verified/name, destination)
          PY
          git add scripts/offline/sm2-provider/package-lock.json packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/sm2-provider.generated.cjs packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/SM2-NOTICE.txt packages/insomnia/src/vendor/insomnia-plugin-offline-crypto-tools/SM2-PROVENANCE.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(crypto): vendor compact SM2 provider verified against independent OpenSSL'
          git push origin HEAD:offline/basic-sm2-provider
          git log -1 --format='%H %T'
