name: Prepare reviewed offline sources
on:
  push:
    branches: [offline/standalone-vendored]
    paths:
      - scripts/offline/source-migration.*
      - scripts/offline/vendor-plugins.py
      - .github/workflows/offline-prepare.yml
permissions:
  contents: read
concurrency:
  group: offline-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Live-yum/insomnia'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: offline/standalone-vendored
          persist-credentials: false
          fetch-depth: 1
      - name: Materialize reviewed application changes and pinned plugin sources
        run: |
          python3 scripts/offline/source-migration.py
          python3 scripts/offline/vendor-plugins.py
      - name: Commit actual sources (never force push)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/insomnia/src packages/insomnia-data/src
          git diff --cached --check
          git commit -m 'feat: materialize offline application and vendor pinned Crypto plugin sources'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/offline/standalone-vendored
      - name: Export exact result for review
        run: git archive --format=tar --output=offline-prepared.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-prepared-source
          path: offline-prepared.tar
          retention-days: 3
          if-no-files-found: error
